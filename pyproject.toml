[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-audio-pipeline"
version = "0.1.0"
description = "Audio acquisition, one-to-one spreadsheet matching and auditable dataset preparation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "s960137"}]
dependencies = [
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "openpyxl>=3.1.5,<4",
  "requests>=2.32.3,<3",
]

[project.optional-dependencies]
browser = ["selenium>=4.25,<5"]

[project.scripts]
clinical-audio = "clinical_audio_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
